name: Cross-Platform Release (Android & Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type check and unit tests
        run: |
          npm run lint
          npx vitest run test/platform.test.ts

      - name: Generate Android icons from assets/
        run: npx --yes @capacitor/assets generate --android --assetPath assets

      - name: Inject Firebase google-services.json
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then
            printf '%s' "$GSJ" > android/app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set - push notifications disabled in this build"
          fi

      - name: Write Android Release Keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing. Add the keystore secrets before building a release."
            exit 1
          fi
          printf '%s' "$KS" | base64 -d > tuition-release.jks

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Sync and Build Android Release APK
        run: |
          npm run android:sync
          npm run android:apk
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          KEYSTORE_PATH: ${{ github.workspace }}/tuition-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/app-release.apk

  windows:
    name: Build Windows Desktop App
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type check and unit tests
        run: |
          npm run lint
          npx vitest run test/platform.test.ts

      - name: Generate Windows icon from assets/
        shell: bash
        run: |
          mkdir -p build
          npx --yes png-to-ico assets/icon-256.png > build/icon.ico

      - name: Build Windows Executables (NSIS and Portable)
        run: npm run desktop:build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Upload Windows Executables Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: |
            dist-desktop/*.exe

  release:
    name: Create GitHub Release
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets/android

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-executables
          path: release-assets/windows

      - name: Prepare Release Files
        run: |
          mkdir -p output-files
          cp release-assets/android/app-release.apk output-files/ApexAcademy-Android.apk
          cp release-assets/windows/*.exe output-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: output-files/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
