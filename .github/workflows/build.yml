name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found. Generating Gradle 8.9 wrapper..."
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Build Debug APKs
        run: ./gradlew :app-student:assembleDebug :app-teacher:assembleDebug --stacktrace
