name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Student and Teacher Debug APKs
        run: ./gradlew :app-student:assembleDebug :app-teacher:assembleDebug --stacktrace

      - name: Upload Student APK
        uses: actions/upload-artifact@v4
        with:
          name: app-student-debug
          path: app-student/build/outputs/apk/debug/*.apk

      - name: Upload Teacher APK
        uses: actions/upload-artifact@v4
        with:
          name: app-teacher-debug
          path: app-teacher/build/outputs/apk/debug/*.apk
