name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Assemble APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper & Permissions
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Gradle wrapper not found in repo. Generating wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Core Network & Assemble APKs
        run: ./gradlew :core-network:assembleRelease :app-student:assembleDebug :app-teacher:assembleDebug --stacktrace
